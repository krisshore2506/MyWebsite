<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Choice - Exam Stress Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .choice-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            text-decoration: none;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .student-btn {
            background: linear-gradient(45deg, #00f7ff, #00ffd5);
            color: black;
            box-shadow: 0 0 15px rgba(0, 247, 255, 0.4);
        }
        .student-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 247, 255, 0.6);
        }
        .admin-btn {
            background: linear-gradient(45deg, #8a2be2, #d100ff);
            color: white;
            box-shadow: 0 0 15px rgba(209, 0, 255, 0.4);
        }
        .admin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(209, 0, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="login-container">
            <div class="login-card">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo-img">
                <h2>Welcome</h2>
                <p class="subtitle">Select your login type to continue</p>
                
                <div style="margin-top: 30px;">
                    <a href="{{ url_for('login') }}" class="choice-btn student-btn">Student Login</a>
                    <a href="{{ url_for('admin_login') }}" class="choice-btn admin-btn">Admin Login</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

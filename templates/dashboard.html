<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Modern OTP System</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            color: var(--text-color);
            min-height: 100vh;
        }

        .navbar {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: white;
            text-decoration: none;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: white;
        }

        .nav-links .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            transition: all 0.3s ease;
        }

        .nav-links .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            color: white;
            border-color: rgba(239, 68, 68, 0.5);
        }

        .main-content {
            padding: 60px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            font-weight: 600;
        }

        p.welcome-text {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .email-badge {
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .stat-title {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: white;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="#" class="logo">AppLogo</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('logout') }}" class="logout-btn">Log Out</a>
        </div>
    </nav>

    <div class="main-content">
        <div class="glass-card">
            <h1>Welcome to your Dashboard!</h1>
            <p class="welcome-text">
                Successfully logged in as <span class="email-badge">{{ email }}</span>
            </p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Login Method</div>
                <div class="stat-value">Secure OTP</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Session Valid For</div>
                <div class="stat-value">Active Limit</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Security Status</div>
                <div class="stat-value" style="color: #86efac;">Verified ✓</div>
            </div>
        </div>
    </div>
</body>

</html>
